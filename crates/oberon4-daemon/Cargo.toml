[package]
name = "oberon4-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
jsonschema = "0.45.0"
oberon4-auth = { path = "../oberon4-auth" }
oberon4-core = { path = "../oberon4-core" }
oberon4-provider-anthropic = { path = "../oberon4-provider-anthropic" }
oberon4-provider-openai = { path = "../oberon4-provider-openai" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
wasmtime = { version = "36.0.6", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "36.0.6", default-features = false }
