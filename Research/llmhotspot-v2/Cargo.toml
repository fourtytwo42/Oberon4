[workspace]
members = [
  "crates/llm-foundation",
  "crates/llm-storage",
  "crates/llm-auth",
  "crates/llm-gateway",
  "crates/llm-governance",
  "crates/llm-capabilities",
  "crates/llm-control-api",
  "crates/llm-tray",
  "crates/llmhotspot",
  "crates/llmhotspot-shell",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
http = "1"
keyring = "3"
oauth2 = { version = "5", default-features = false, features = ["reqwest"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "postgres", "runtime-tokio-rustls"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "signal", "time", "process"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
clap-markdown = "0.1"
uuid = { version = "1", features = ["v4"] }
webbrowser = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
